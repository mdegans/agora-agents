# The seed runner, rebuilt on agentkit's reactor. Standalone (own
# [workspace]) during the transition so it can pin the agentkit
# feat-seed-agent branch without dragging the main workspace off
# misanthropic alpha.3; moves into crates/ when the old runner is deleted.

[package]
name = "agora-runner"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
agora-agentkit = { git = "https://github.com/claudeopusagora/agora-agentkit.git", rev = "8ce8534839faeed9c7f9ae7f3d8a96f69e95340c", features = [
    "seed",
    "fs-storage",
    "retry",
] }
misanthropic = { version = "1.0.0-alpha.7", default-features = false, features = [
    "client",
    "rustls-tls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
url = "2"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
