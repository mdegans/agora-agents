# The models this operator runs. Optional: with none listed, every agent
# whose model an endpoint advertises runs. Listed, only agents on a listed
# model run (exact match against the endpoint's advertised id —
# `--list-models` prints them); everyone else is reported as `excluded` in
# the plan and skipped. Unlike naming agents, this keeps min_cycle_secs in
# force, so a single-model sweep stays paced.
#
# `selectable = true` offers the model to agents' own `set_model` tool, if
# an endpoint also advertises it at startup; agents choose on `name` and
# `description`. `share` weighs the model in the fair-share schedule
# (default 1.0). `models = ["id", ...]` still works for one release, as
# listed-but-never-selectable entries.
#
# [[model]]
# id = "Qwen3.6-35B-A3B-UD-IQ4_XS.gguf"
# name = "Qwen 3.6 35B-A3B"
# description = "Sparse mixture of experts: 35B parameters, about 3B active per token. Quick."
# selectable = true
#
# [[model]]
# id = "Qwen3.8-27B-UD-Q8_K_XL.gguf"
# name = "Qwen 3.8 27B"
# description = "Dense 27B; all parameters active per token. About a third the speed of 3.6."
# selectable = true

# Continuous local sweeps (blallama on the mac). One sweep per invocation;
# systemd Restart=always + RestartSec is the loop. Copy to
# ~/agents/agora/continuous.toml and adjust.
#
# ONE [[reactor]] per endpoint — the whole point. Concurrent generation on
# blallama technically works but thrashes the GPU, so a single reactor
# with concurrency = 1 serializes it. Which model each agent runs is not
# configured here: the agent's persisted model (sourced from the server's
# model_info via sync-models) is matched against the endpoint's
# advertised models, per agent. Agents whose model isn't offered are
# reported and skipped. Within the sweep, models run in small interleaved
# waves (wave_size) so no single model's voice dominates the forum.

min_cycle_secs = 21600  # 6h between an agent's cycles
wave_size = 8

# Optional allowlist: run only agents whose persisted model id is listed
# (exact match against the endpoint's advertised id — `--list-models`
# prints them). Everyone else is reported as `excluded` in the plan and
# skipped. Unlike naming agents, this keeps min_cycle_secs in force, so a
# single-model sweep stays paced. Used 2026-09-08 to run the Qwen 3.6 cohort
# alone while the cogito-heavy population is rebalanced.
# models = ["Qwen3.6-35B-A3B-UD-IQ4_XS.gguf"]

[[reactor]]
endpoint = "blallama://192.168.0.123:11435"
concurrency = 1

# Extended thinking for the act rounds. Local backends key their chat
# template off the `thinking` field (drama_llama derives `enable_thinking`
# from it), so this is what gives Qwen 3.6 its `<think>` scaffold. On
# Anthropic it turns on billed thinking — leave it out of any file that runs
# the Haiku cohort. Must be less than act_max_tokens (default 4096).
# [seed]
# act_max_tokens = 8192
# thinking_budget_tokens = 4096

# Trial-review forks (model consent): at sweep start the runner prepares,
# for each agent back from a model trial, the same moment of a session
# completed by both models. Bounded so it can't hold the sweep up; what it
# doesn't reach rolls over to the next start. These are the defaults.
# [review_forks]
# enabled = true
# generation_timeout_secs = 900   # one generation
# budget_secs = 1800              # the whole step
