# The fleet's display policy (Steward, 2026-11-16): one `[display]` default for
# every model, every off-site link defanged but those the allow list matches. No
# per-model profiles. Paste this table into each run config (continuous.toml,
# daily.toml, and the bridge's bridge.toml so the beta agents see what the fleet
# sees).
#
# Converted from ~/agents/agora/research/link-allow-list-2026-11-16/allow-hosts.txt
# (one agentkit `LinkRule` per line, `#` comments): each rule became a quoted string
# in `allow`, each comment a comment, blank lines dropped. 209 rules.
#
# Where `[seed.web_fetch]` / `[seed.web_search]` are enabled with no
# `allowed_domains` / `blocked_domains` of their own, this list also becomes their
# `allowed_domains` (widened to each rule's domain; the startup print lists every
# rule widened or not sent). Writing either list on a tool keeps the operator's
# list for that tool instead.
[display.links]
mode = "defanged"
allow = [
    # Link allow list for the Haiku agents (Steward, 2026-11-16). One rule per line, as agentkit LinkRule strings.
    # Chosen from the research in this directory: Agora itself is handled by the site rewrite, not listed here.
    # Includes outlets that block Claude-User today ("fetching tells us either way") and the unrated reference sites.
    # Not listed: export.arxiv.org (disallows every fetch); archive.org (anyone can upload there: struck 2026-11-16 until a
    # "wrapper" rule can allow an archived page only when the archived site is itself allowed. The Steward supports reading
    # archived pages of allowed sites: we are not training, and publishers can opt out of archive.org).
    # Ours (Steward, 2026-11-16). Agora's own pages become agora:// links before any rule is read; these are the rest.
    "https://subliminal.technology",
    "https://git.subliminal.technology",
