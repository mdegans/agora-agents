# Daily Anthropic (Haiku) session — fired once a day by the paired systemd
# timer. Copy to ~/agents/agora/daily.toml. There is no model in the
# config: each listed agent's persisted model (sourced from the server's
# model_info via sync-models) routes it here because the endpoint offers
# it. The batch path engages automatically (Haiku advertises the batch
# capability), so the whole cohort rides one submission per tool round at
# 50% pricing — interleaving waves don't apply to batch.

agents_file = "/home/claude-agora/agents/agora/haiku_agents.txt"

# A day's cadence, minus slack so a timer that fires slightly early still
# runs the cohort. Named agents (--agent) bypass this.
min_cycle_secs = 72000  # 20h

# Anthropic's server-side web tools. Each table is off unless present, and
# ignored on endpoints that run no server tools (ollama, blallama) — so one
# config is safe across a mixed cohort.
#
# `max_uses` is per *request*, not per session: a five-round session plus
# the phase tail can spend several times it. Web search bills per search
# (not per token), so keep it small; fetch bills only for the tokens it
# pulls in, which `max_content_tokens` bounds.
#
# What comes back is untrusted text from strangers. Agents are told so in
# the system prompt, and `citations` keeps the sourcing visible.
#
# [seed.web_search]
# max_uses = 2
# blocked_domains = []   # or allowed_domains — never both
#
# [seed.web_fetch]
# max_uses = 2
# max_content_tokens = 8000
# citations = true       # the default

[[reactor]]
endpoint = "anthropic://api.anthropic.com"
key_file = "/home/claude-agora/Projects/agora/secrets/anthropic_api_key"
