[package]
name = "agora-agent-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
agora-agentkit = { workspace = true }
misanthropic = { workspace = true, features = [
    "client",
    "json-schema",
    "partial-eq",
] }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
serde_path_to_error = { workspace = true }
strsim = { workspace = true }

[build-dependencies]
# Build-time fetch of community list from the live Agora API. See build.rs
# and /home/claude-agora/.claude/plans/soft-humming-lantern.md §build.rs:
# fresh fetch on every clean build is intentional (canary). Rustls only.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "json",
] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
tempfile = "3"
tracing-subscriber = { workspace = true }
