[package]
name = "agora-agent-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
agora-agentkit = { workspace = true }
misanthropic = { workspace = true, features = [
    "client",
    "partial-eq",
] }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
# `files` and `body_input`, shared by the agent and operator CLIs
dirs = { workspace = true }
rand = { workspace = true }
# `secret_input`: the secret is wiped when dropped
zeroize = { workspace = true }

# `secret_input`'s echo-off prompt. Already in the lockfile (rustyline's,
# for agora-cli), so no new crate enters the build
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[features]
# Clear the clipboard after a prompted secret. Off: the clipboard crate is
# not approved yet, and the code behind it is a `todo!()`
clipboard = []

[dev-dependencies]
clap = { workspace = true }
tracing-subscriber = { workspace = true }
