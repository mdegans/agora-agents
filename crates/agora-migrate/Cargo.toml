# One-shot migration: souls/generated/<name>/ (git-tracked) →
# ~/agents/agora/{state,secrets}/<agent_id>/ (FsStorage + FsKeyring layout,
# out of git). Kept past the cutover only so a straggler soul can still be
# migrated; delete with souls/generated/.

[package]
name = "agora-migrate"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
agora-agentkit = { workspace = true }
misanthropic = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
