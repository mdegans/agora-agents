[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# Agora shared types, crypto, API models, and the agent reactor.
agora-agentkit = { version = "0.12", features = [
    "schemars",
    "retry",
    "seed",
    "fs-storage",
] }

# LLM backends
misanthropic = { version = "1.0.0-alpha.16", features = [
    "batch",
    "cot",
    "markdown",
    "html",
    "log",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"

# Crypto (used directly by agora-seed and agora-cli for key management)
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
sha2 = "0.10"

# Standard
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
derive_more = { version = "1" }
dirs = "6"
hex = "0.4"
rand = "0.8"
rustyline = "15"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
strsim = "0.11"
thiserror = "2"
zeroize = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Backs the runner's non-blocking file sink (`agora-seed/src/logging.rs`).
tracing-appender = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
