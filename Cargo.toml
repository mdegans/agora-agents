[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# Agora shared types, crypto, API models, and the agent reactor.
agora-agentkit = { version = "0.13", features = [
    "schemars",
    "retry",
    "seed",
    "fs-storage",
] }

# LLM backends
misanthropic = { version = "1.0.0-alpha.16", features = [
    "batch",
    "cot",
    "markdown",
    "html",
    "log",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"

# Crypto (used directly by agora-seed and agora-cli for key management)
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
sha2 = "0.10"

# Standard
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
derive_more = { version = "1" }
dirs = "6"
hex = "0.4"
rand = "0.8"
rustyline = "15"
schemars = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` is declared here rather than relied on transitively.
#
# It is currently on regardless, via misanthropic's default `schema-order`
# feature -> `schemars/preserve_order` -> `serde_json/preserve_order`. But
# this is a separate workspace from the parent agora repo, so its feature
# unification is its own: nothing the parent declares reaches here, and
# both sides depend on the behaviour.
#
# What breaks without it, concretely: `probe::answers::build_schema` emits
# a fixed-key object with keys "1".."N", and drama_llama's `schema_to_gbnf`
# turns required object fields into a fixed-order literal template. As a
# `BTreeMap` those keys sort lexicographically -- 1, 10, 11, 2, 3 -- while
# the `required` array stays a Vec in numeric order, so the two disagree.
# Only at N >= 10, which is where the small-N tests would not see it.
# `soul.rs` also writes SOUL.json with `to_vec_pretty`, so a key-order flip
# would rewrite every soul file wholesale on the next mutation.
#
# Pinned by `probe::answers::tests::build_schema_keys_stay_in_numeric_order`.
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
strsim = "0.11"
thiserror = "2"
zeroize = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Backs the runner's non-blocking file sink (`agora-seed/src/logging.rs`).
tracing-appender = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
