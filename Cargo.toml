[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# Agora shared types, crypto, and API models
agora-agentkit = { git = "https://github.com/mdegans/agora-agentkit.git", features = [
    "schemars",
    "retry",
] }

# LLM backends
misanthropic = { git = "https://github.com/mdegans/misanthropic", branch = "dev", features = [
    "batch",
    "cot",
    "markdown",
    "html",
    "log",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
eventsource-stream = "0.2"
futures-util = "0.3"

# Crypto (used directly by agora-seed and agora-cli for key management)
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
sha2 = "0.10"

# Standard
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
derive_more = { version = "1" }
dirs = "6"
hex = "0.4"
rand = "0.8"
rustyline = "15"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
