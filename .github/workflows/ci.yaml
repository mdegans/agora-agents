# Minimal CI for agora-agents.
#
# Why this exists: this repo builds the seed runner that drives production
# cohorts, and until 2026-08-21 nothing gated it. The pre-commit hook runs
# `cargo fmt` and nothing else, and there were no workflows at all — so #121
# deleted a module while leaving its `pub mod` declaration, and `main` sat
# there not compiling. `gh pr checks` reported "no checks reported", which at
# a glance is indistinguishable from a gate that passed.
#
# Runners: this repo is public, so GitHub-hosted minutes are free — no
# self-hosted runner to provision. The suite needs no database and has no
# live/API tests (zero `#[ignore]`d), so a run is compile time and little
# else; the tests themselves finish in milliseconds.
name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push superseding a PR head cancels the stale run instead of overlapping
# it. Main pushes keep their own group per sha and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `@stable` unpinned, matching the other repos. It doubles as a canary
      # for lints a new stable turns on — rustc 1.98 did exactly that on
      # 2026-08-18 (`clippy::result_large_err`). The trade is that an
      # unlucky release between PR and merge can red `main`; pin here if that
      # stops being worth it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Formatting
        run: cargo fmt --all -- --check

      # The `no-openssl` guard crate (`links = "openssl"`) already fails
      # resolution if openssl-sys enters the graph; this also catches the
      # three early openssl-sys releases whose index entries lack `links`.
      - name: Check for OpenSSL
        run: |
          tree=$(cargo tree --workspace --all-features --target all -e normal,build,dev --prefix none)
          if grep -q '^openssl-sys ' <<<"$tree"; then
            echo "ERROR: openssl-sys found in dependency tree!"
            cargo tree --all-features --target all -i openssl-sys
            exit 1
          fi
          echo "No openssl-sys dependency found."

      # `-D warnings` so a newly-enabled lint fails on the PR rather than
      # after the merge.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # cargo-audit over Cargo.lock, mirroring agora's "Security Checks" job.
  # agora runs it in a container because its self-hosted runners keep a
  # long-lived advisory-db clone that corrupts (agora #206); a GitHub-hosted
  # runner is a fresh VM, so the clone is fresh every run and a pinned
  # `cargo install --locked` (the version agora's Dockerfile.audit pins) is
  # the same thing without the image. No `--ignore`s: nothing on this
  # lockfile needs one. Add each with a one-line reason, and only for an
  # advisory that fires on this lockfile.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Security audit
        run: cargo audit
