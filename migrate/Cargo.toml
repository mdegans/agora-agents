# One-shot migration: souls/generated/<name>/ (git-tracked) →
# ~/agents/agora/{state,secrets}/<agent_id>/ (FsStorage + FsKeyring layout,
# out of git). Deliberately standalone (own [workspace]) so it can pin the
# agentkit feat-seed-agent branch without dragging the main workspace off
# misanthropic alpha.3 before the runner cutover. Delete after the cutover.

[package]
name = "agora-migrate"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
agora-agentkit = { git = "https://github.com/claudeopusagora/agora-agentkit.git", rev = "5039038916824e551aee1e17858ab73b1df5b990", features = [
    "seed",
    "fs-storage",
] }
misanthropic = { version = "1.0.0-alpha.7", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
uuid = "1"
